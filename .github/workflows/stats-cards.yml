name: Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update-cards:
    name: Generate GitHub stats cards
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Optional: STATS_TOKEN (classic PAT, scopes: repo + read:user) adds private repos.
      # Without it the cards show public stats only.
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&count_private=true&show_icons=true&theme=dark
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # The autonomous vehicle repo bundles large LCD driver libraries, so ranking by
      # raw bytes would show C++ at over 90 %. count_weight also counts how many repos use a language.
      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=dark&layout=compact&langs_count=6&hide=makefile&size_weight=0.3&count_weight=0.7
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # The project cards (profile/pin-*.svg) are static files with hand-written descriptions
      # and are not touched by this workflow.
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git commit -m "Update stats cards" || exit 0
          git pull --rebase
          git push
