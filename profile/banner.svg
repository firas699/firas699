<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Firas Ben Fraj – Ingenieur Mechatronik und Informatik">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b2433"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="240" fill="url(#bg)"/>
  <rect width="1200" height="240" fill="url(#grid)"/>
  <!-- CAN-Signalverlauf als dezentes Motiv -->
  <polyline fill="none" stroke="#2f81f7" stroke-opacity="0.35" stroke-width="3" stroke-linejoin="round"
    points="640,170 640,120 700,120 700,170 760,170 760,170 820,170 820,120 900,120 900,170 940,170 940,120 980,120 980,170 1060,170 1060,120 1200,120"/>
  <polyline fill="none" stroke="#58a6ff" stroke-opacity="0.15" stroke-width="3" stroke-linejoin="round"
    points="640,200 700,200 700,160 740,160 740,200 840,200 840,160 920,160 920,200 1000,200 1000,160 1060,160 1060,200 1200,200"/>
  <rect x="64" y="58" width="6" height="124" rx="3" fill="url(#accent)"/>
  <text x="92" y="108" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="0.5">Firas Ben Fraj</text>
  <text x="94" y="148" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#c9d1d9">Ingenieur Mechatronik und Informatik</text>
  <text x="94" y="182" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8b949e" letter-spacing="1.5">EMBEDDED  ·  ROBOTIK  ·  FAHRZEUGTEST</text>
</svg>
